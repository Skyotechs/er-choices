openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/hospitals/by-state:
    get:
      operationId: browseAdminHospitalsByState
      summary: Browse every editable hospital record in a state
      description: Alphabetical, paginated records including deactivated hospitals by default. Requires the admin bearer token.
      security:
        - adminBearer: []
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string, pattern: "^[A-Za-z]{2}$" }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, enum: [25, 50, 100], default: 50 }
        - in: query
          name: status
          schema: { type: string, enum: [all, active, inactive], default: all }
      responses:
        "200":
          description: Hospital records and the total matching the selected state and status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHospitalStatePage"
        "400":
          description: Invalid state, page, page size, or status
        "401":
          description: Missing or invalid admin token
        "500":
          description: Could not load hospitals
  /admin/hospitals/{id}/speciality:
    get:
      operationId: getAdminHospitalSpeciality
      summary: Read current Speciality evidence and preserved legacy values
      security: [{ adminBearer: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Current reviewed entries and raw legacy information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HospitalSpecialityReview" }
        "401": { description: Unauthorized }
        "404": { description: Hospital not found }
        "503": { description: Hospital store or review data unavailable }
    put:
      operationId: updateAdminHospitalSpeciality
      summary: Replace reviewed entries with identity and revision protection
      security: [{ adminBearer: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HospitalSpecialityUpdate" }
      responses:
        "200":
          description: Saved review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HospitalSpecialityReview" }
        "400": { description: Invalid or conflicting classification evidence }
        "401": { description: Unauthorized }
        "409": { description: Stale identity or revision; reload before editing }
        "503": { description: Hospital store unavailable; no save acknowledged }
  /hospitals/nearby:
    get:
      operationId: getNearbyHospitals
      summary: Nearby hospitals with evidence-backed Speciality entries
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number } }
        - { in: query, name: lon, required: true, schema: { type: number } }
        - { in: query, name: radius, schema: { type: number, default: 50 } }
      responses:
        "200":
          description: Nearby hospitals; legacy fields retained for old-client transport compatibility
          content:
            application/json:
              schema:
                type: object
                required: [hospitals]
                properties:
                  hospitals:
                    type: array
                    items: { $ref: "#/components/schemas/PublicHospital" }
        "400": { description: Invalid coordinates }
        "500": { description: Hospital query failed }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
  schemas:
    SpecialityEntry:
      type: object
      required: [category, classification, population, status, authority, sourceUrl, verifiedOn, officialConfirmed]
      properties:
        category: { type: [string, "null"], enum: [Trauma, Stroke, Burn, Pediatric, Obstetrics, Psychiatric, Cardiac, Cancer, HazMat, null] }
        classification: { type: string, minLength: 1, maxLength: 200 }
        population: { type: string, enum: [All, Adult, Pediatric] }
        status: { type: string, enum: [unverified, verified] }
        authority: { type: string, maxLength: 200 }
        sourceUrl: { type: string, maxLength: 2000 }
        verifiedOn: { type: string, maxLength: 10 }
        officialConfirmed: { type: boolean }
    SpecialityInput:
      type: object
      description: Enter a category/speciality OR a classification/level. Saving as an authenticated administrator confirms the researched entry. Population and supporting metadata are optional; existing details are retained.
      properties:
        category: { type: [string, "null"], enum: [Trauma, Stroke, Burn, Pediatric, Obstetrics, Psychiatric, Cardiac, Cancer, HazMat, null] }
        classification: { type: string, maxLength: 200 }
        population: { type: string, enum: [All, Adult, Pediatric] }
        authority: { type: string, maxLength: 200 }
        sourceUrl: { type: string, maxLength: 2000 }
        verifiedOn: { type: string, maxLength: 10 }
    HospitalSpecialityUpdate:
      type: object
      required: [recordIdentity, expectedRevision, entries]
      properties:
        recordIdentity: { type: string, maxLength: 2048 }
        expectedRevision: { type: string, maxLength: 100 }
        entries:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/SpecialityInput" }
    HospitalSpecialityReview:
      type: object
      required: [id, recordIdentity, revision, entries, legacy]
      properties:
        id: { type: integer }
        recordIdentity: { type: string }
        revision: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SpecialityEntry" }
        legacy:
          type: object
          additionalProperties: true
    PublicHospital:
      type: object
      required: [id, name, state, latitude, longitude, distance, categories, specialities]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distance: { type: number }
        categories: { type: array, items: { type: string } }
        specialities:
          type: array
          items: { $ref: "#/components/schemas/SpecialityEntry" }
    AdminHospitalStatePage:
      type: object
      required: [hospitals, total, page, pageSize, totalPages]
      properties:
        hospitals:
          type: array
          items:
            $ref: "#/components/schemas/AdminHospitalRecord"
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [25, 50, 100] }
        totalPages: { type: integer, minimum: 0 }
    AdminHospitalRecord:
      type: object
      required: [id, name, state, active]
      properties:
        id: { type: integer }
        cmsId: { type: ["string", "null"] }
        osmId: { type: ["string", "null"] }
        name: { type: string }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: string }
        zip: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        specialties:
          type: array
          items: { type: string }
        actualDesignation: { type: ["string", "null"] }
        serviceLine: { type: ["string", "null"] }
        strokeDesignation: { type: ["string", "null"] }
        burnDesignation: { type: ["string", "null"] }
        pciCapability: { type: ["string", "null"] }
        helipad: { type: ["boolean", "null"] }
        beds: { type: ["integer", "null"] }
        source: { type: string }
        active: { type: boolean }
        deactivatedReason: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

